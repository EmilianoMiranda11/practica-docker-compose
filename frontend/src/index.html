<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 text-center">Gestión de Incidencias</h1>

        <!-- Formulario para crear -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white">Registrar Nueva Incidencia</div>
            <div class="card-body">
                <form id="incidenciaForm">
                    <div class="mb-3">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" class="form-control" id="titulo" required>
                    </div>
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcion" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="prioridad" class="form-label">Prioridad</label>
                        <select class="form-select" id="prioridad">
                            <option value="baja">Baja</option>
                            <option value="media" selected>Media</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Guardar Incidencia</button>
                </form>
            </div>
        </div>

        <!-- Listado de Incidencias -->
        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white">Listado de Incidencias</div>
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Descripción</th>
                            <th>Prioridad</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaIncidencias">
                        <!-- Dinámico con JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/';

        async function cargarIncidencias() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                const tbody = document.getElementById('tablaIncidencias');
                tbody.innerHTML = '';

                if (Array.isArray(data)) {
                    data.forEach(inc => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${inc.id}</td>
                                <td>${inc.titulo}</td>
                                <td>${inc.descripcion}</td>
                                <td><span class="badge bg-${inc.prioridad === 'alta' ? 'danger' : (inc.prioridad === 'media' ? 'warning' : 'info')}">${inc.prioridad}</span></td>
                                <td>${inc.estado}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="eliminarIncidencia(${inc.id})">Eliminar</button>
                                </td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error("Error al cargar incidencias:", err);
            }
        }

        document.getElementById('incidenciaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const titulo = document.getElementById('titulo').value;
            const descripcion = document.getElementById('descripcion').value;
            const prioridad = document.getElementById('prioridad').value;

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo, descripcion, prioridad, estado: 'abierta' })
            });

            document.getElementById('incidenciaForm').reset();
            cargarIncidencias();
        });

        async function eliminarIncidencia(id) {
            if (confirm('¿Estás seguro de eliminar esta incidencia?')) {
                await fetch(`${API_URL}?id=${id}`, { method: 'DELETE' });
                cargarIncidencias();
            }
        }

        cargarIncidencias();
    </script>
</body>
</html>
